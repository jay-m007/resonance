[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resonance"
version = "0.1.0"
description = "Turn support conversations into a ranked list of product issues"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jay Maurya" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3"]

[project.optional-dependencies]
st = ["sentence-transformers>=2.2"]
server = ["fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9"]
dev = ["pytest>=7"]

[project.scripts]
resonance = "resonance.cli:main"

[tool.setuptools.packages.find]
include = ["resonance*"]
